<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>深蓝舰队 · 海军标准智能助手</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css?v=32">
</head>
<body>

<div class="app-wrapper" style="display: flex; width: 100%; height: 100vh; overflow: hidden;">
<aside class="sidebar">
    <div class="sidebar-top">
        <div class="brand">
            <span class="brand-icon">⚓</span>
            <span class="brand-text">海军标准智能助手</span>
        </div>
        <button class="btn-new-chat" onclick="newChat()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            新对话
        </button>
        <div class="tool-list">
            <button class="tool-item" data-panel="upload" onclick="switchPanel('upload')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                上传文档
            </button>
        </div>
    </div>
    <div class="sidebar-bottom">
        <div class="history-header">
            <span>    历史对话</span>
            <button onclick="clearHistory()" title="清空" class="btn-icon">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
        </div>
        <div class="history-list" id="historyList"></div>
    </div>
</aside>

<main class="main" id="mainArea">

    <section class="page show" id="page-chat">
        <div class="chat-wrap">
            <div class="chat-body" id="chatBody">
                <div class="welcome" id="welcomeBlock">
                    <h1>⚓ 您好，我是海军标准智能助手</h1>
                    <p class="welcome-desc">严格依托入库标准作答，杜绝编造，<strong style="color: #f5c542;">强制溯源</strong></p>
                    <div class="hint-grid">
                        <button class="hint-card" onclick="sendHint('信息技术与大数据服务的安全能力应符合哪些标准要求？')">
                            <span class="hint-icon">🔐</span>
                            <span>信息技术与大数据服务的安全能力应符合哪些标准要求？</span>
                        </button>
                        <button class="hint-card" onclick="sendHint('机械电气设备的电磁兼容抗扰度要求有哪些？')">
                            <span class="hint-icon">⚡</span>
                            <span>机械电气设备的电磁兼容抗扰度要求有哪些？</span>
                        </button>
                        <button class="hint-card" onclick="sendHint('个体防护装备的术语定义与规范依据是什么？')">
                            <span class="hint-icon">🛡️</span>
                            <span>个体防护装备的术语定义与规范依据是什么？</span>
                        </button>
                        <button class="hint-card" onclick="sendHint('电气舵角指示器的技术要求应符合哪项标准？')">
                            <span class="hint-icon">🧭</span>
                            <span>电气舵角指示器的技术要求应符合哪项标准？</span>
                        </button>
                    </div>
                </div>
                <div class="msg-list" id="msgList"></div>
            </div>
            <div class="chat-foot">
                <div class="mode-bar">
                    <button class="mode-btn active" data-mode="chat" onclick="setMode('chat')">💬 智能问答</button>
                    <button class="mode-btn" data-mode="optimize" onclick="setMode('optimize')">✏️ 文本优化</button>
                    <button class="mode-btn" data-mode="gap" onclick="setMode('gap')">🔬 标准诊断</button>
                </div>
                <div class="optimize-panel" id="optimizePanel" style="display:none;">
                    <div class="opt-row">
                        <span class="opt-label">文风</span>
                        <div class="opt-pills" id="stylePills">
                            <button class="opt-pill active" data-val="standard">标准制式</button>
                            <button class="opt-pill" data-val="concise">简洁干练</button>
                            <button class="opt-pill" data-val="authoritative">权威专业</button>
                            <button class="opt-pill" data-val="briefing">汇报演示</button>
                        </div>
                    </div>
                    <div class="opt-row">
                        <span class="opt-label">强度</span>
                        <div class="opt-pills" id="intensityPills">
                            <button class="opt-pill" data-val="light">轻度</button>
                            <button class="opt-pill active" data-val="medium">中度</button>
                            <button class="opt-pill" data-val="deep">重度</button>
                        </div>
                    </div>
                    <div class="opt-row">
                        <span class="opt-label">篇幅</span>
                        <div class="opt-pills" id="lengthPills">
                            <button class="opt-pill active" data-val="keep">保持原长</button>
                            <button class="opt-pill" data-val="shorten">精简缩写</button>
                            <button class="opt-pill" data-val="expand">适当扩写</button>
                        </div>
                    </div>
                </div>
                <div class="optimize-panel" id="diagnosisPanel" style="display:none;">
                    <div class="opt-row">
                        <span class="opt-label">深度</span>
                        <div class="opt-pills" id="depthPills">
                            <button class="opt-pill" data-val="quick">快速合规</button>
                            <button class="opt-pill active" data-val="full">全链路诊断</button>
                        </div>
                    </div>
                    <div class="opt-row">
                        <span class="opt-label">领域</span>
                        <div class="opt-pills" id="fieldPills">
                            <button class="opt-pill active" data-val="general">通用</button>
                            <button class="opt-pill" data-val="ship">舰船装备</button>
                            <button class="opt-pill" data-val="document">军用公文</button>
                            <button class="opt-pill" data-val="bigdata">大数据</button>
                            <button class="opt-pill" data-val="safety">劳保防护</button>
                        </div>
                    </div>
                </div>
                <div class="continue-row" id="continueRow">
                    <span style="font-size:12px;color:var(--text3);white-space:nowrap;">继续调整:</span>
                    <input id="continueInput" placeholder="如：再正式一点 / 精简到500字 / 保留第三条..." onkeydown="if(event.key==='Enter'){event.preventDefault();continueOptimize();}">
                    <button id="continueBtn">应用</button>
                </div>
                <div class="input-box">
                    <button id="attachBtn" class="btn-attach" title="上传标准文件进行分析" onclick="document.getElementById('gapFileInput').click()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                    </button>
                    <input type="file" id="gapFileInput" accept=".pdf,.docx,.txt" hidden onchange="onGapFile(this.files)">
                    <textarea id="chatInput" rows="1" placeholder="输入你的问题..." onkeydown="onInputKey(event)" oninput="autoGrow(this)"></textarea>
                    <div class="btn-wrapper">
                        <button id="sendBtn" class="btn-send" onclick="send()">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                        </button>
                        <button id="stopBtn" class="btn-stop" onclick="stopGeneration()" style="display: none;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="4" y="4" width="16" height="16" rx="2" />
                            </svg>
                        </button>
                    </div>
                </div>
            <p class="foot-hint" id="footHint">💬 Enter 发送 · Shift+Enter 换行 </p>
            </div>
        </div>
    </section>

    <section class="page" id="page-upload">
        <div class="page-inner">
            <button class="btn-back" onclick="switchPanel('chat')">← 返回</button>
            <h2>📄 上传标准文档</h2>
            <p class="page-sub">支持 PDF、DOCX、TXT 格式，自动解析清洗分块入库</p>
            <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <p class="drop-icon">📂</p>
                <p>点击选择文件或拖拽到此处</p>
            </div>
            <div style="display:flex;gap:10px;margin-top:10px;align-items:center">
                <label class="btn-folder">
                    📁 上传文件夹
                    <input type="file" id="folderInput" webkitdirectory style="display:none" onchange="onFiles(this.files)">
                </label>
                <span style="font-size:12px;color:var(--text3)">自动筛选 PDF / DOCX / TXT</span>
            </div>
            <input type="file" id="fileInput" accept=".pdf,.docx,.txt" multiple hidden onchange="onFiles(this.files)">
            <div id="pendingArea"></div>
            <div id="docsArea" style="margin-top:24px"></div>
        </div>
    </section>
</main>
</div>

<script src="/static/app.js?v=32"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>if(typeof marked==='undefined'){console.warn('marked CDN failed');}</script>
</body>
</html>
